# LLaMA-Factory 4-Bit QLoRA Configuration for 4GB VRAM (NVIDIA RTX 3050 Laptop)
# Model
model_name_or_path: Qwen/Qwen2.5-Coder-1.5B-Instruct
quantization_bit: 4
quantization_type: nf4
double_quantization: true

# Fine-tuning Method
stage: sft
do_train: true
finetuning_type: lora
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05

# Dataset
dataset: polyglot_instruct_dataset
template: qwen
cutoff_len: 1024
max_samples: 10000
overwrite_cache: true
preprocessing_num_workers: 2

# Output & Checkpoints
output_dir: D:\RAG-Agent\models\lora_adapters\stem-coder-expert
logging_steps: 10
save_steps: 100
plot_loss: true
overwrite_output_dir: true

# Hyperparameters (VRAM Budget: <= 3.8 GB)
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
optim: paged_adamw_8bit
gradient_checkpointing: true
ddp_timeout: 180000000
